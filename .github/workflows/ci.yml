name: AwareMate CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Build, Lint & Test
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Setup Firebase google-services.json placeholder
        run: |
          if [ ! -f androidApp/google-services.json ]; then
            echo "Copying template google-services.json for CI..."
            cp androidApp/google-services.json.example androidApp/google-services.json
          fi

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Run Lint
        run: ./gradlew lintDebug --stacktrace

      - name: Run Unit Tests
        run: ./gradlew test --stacktrace

      - name: Assemble Debug APK
        run: ./gradlew assembleDebug --stacktrace

      - name: Build Android App Bundle (AAB for Google Play)
        run: ./gradlew :androidApp:bundleRelease --stacktrace

      - name: Upload Release Bundle Artifact
        uses: actions/upload-artifact@v4
        with:
          name: awaremate-release-aab
          path: androidApp/build/outputs/bundle/release/
          retention-days: 14

      - name: Upload Debug APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: awaremate-debug-apk
          path: androidApp/build/outputs/apk/debug/
          retention-days: 14

      - name: Upload Test Reports (on failure)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-and-lint-reports
          path: |
            **/build/reports/
            **/build/test-results/
          retention-days: 7
